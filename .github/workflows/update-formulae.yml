name: Update formulae

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Update formulae
        run: ./Scripts/update-formulae.rb
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify changed formula installations before publishing
        run: |
          while IFS= read -r formula; do
            ./Scripts/test-formulae.sh "$formula"
          done < <(git diff --name-only -- Formula)

      - name: Commit changes
        run: |
          git diff --quiet Formula && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          git commit -m "Update Homebrew formulae"
          git push
