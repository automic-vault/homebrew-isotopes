name: Test formula installations

on:
  pull_request:
    paths: ["Formula/**", "Scripts/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["Formula/**", "Scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash Scripts/test-build-isotopes.sh
      - run: Scripts/test-formulae.sh
